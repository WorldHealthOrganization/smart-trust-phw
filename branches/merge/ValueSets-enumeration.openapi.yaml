openapi: 3.0.3
info:
  title: ValueSets Enumeration API
  description: API endpoint providing an enumeration of all available ValueSet schemas
  version: 1.0.0
paths:
  /ValueSets.json.schema:
    get:
      summary: Get enumeration of all ValueSet schemas
      description: Returns a list of all available ValueSet schemas with metadata
      responses:
        '200':
          description: Successfully retrieved valueset enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumerationResponse'
              example: &id001
                type: valueset
                count: 6
                schemas:
                - filename: ValueSet-v2-0203.schema.json
                  id: http://terminology.hl7.org/ValueSet-v2-0203.schema.json
                  title: v2 Identifier Type Schema
                  description: JSON Schema for v2 Identifier Type ValueSet codes.
                    Generated from FHIR expansions.
                  url: ./ValueSet-v2-0203.schema.json
                  valueSetUrl: http://terminology.hl7.org/ValueSet/v2-0203
                  codeCount: 143
                - filename: ValueSet-DVCRelationshipStatus.schema.json
                  id: http://smart.who.int/trust-phw/ValueSet-DVCRelationshipStatus.schema.json
                  title: Relationship Status for Contact in Patient Schema
                  description: JSON Schema for Relationship Status for Contact in
                    Patient ValueSet codes. Generated from FHIR expansions.
                  url: ./ValueSet-DVCRelationshipStatus.schema.json
                  valueSetUrl: http://smart.who.int/trust-phw/ValueSet/DVCRelationshipStatus
                  codeCount: 2
                - filename: ValueSet-HL.TYPE.schema.json
                  id: http://smart.who.int/trust-phw/ValueSet-HL.TYPE.schema.json
                  title: HL.TYPE ValueSet  Schema
                  description: JSON Schema for HL.TYPE ValueSet  ValueSet codes. Generated
                    from FHIR expansions.
                  url: ./ValueSet-HL.TYPE.schema.json
                  valueSetUrl: http://smart.who.int/trust-phw/ValueSet/HL.TYPE
                  codeCount: 2
                - filename: ValueSet-v3-Country.schema.json
                  id: http://terminology.hl7.org/ValueSet-v3-Country.schema.json
                  title: Country Schema
                  description: JSON Schema for Country ValueSet codes. Generated from
                    FHIR expansions.
                  url: ./ValueSet-v3-Country.schema.json
                  valueSetUrl: http://terminology.hl7.org/ValueSet/v3-Country
                  codeCount: 249
                - filename: ValueSet-PreQualProductIds.schema.json
                  id: http://smart.who.int/pcmt-vaxprequal/ValueSet-PreQualProductIds.schema.json
                  title: WHO PreQualificaiton Vaccine Product Ids Schema
                  description: JSON Schema for WHO PreQualificaiton Vaccine Product
                    Ids ValueSet codes. Generated from FHIR expansions.
                  url: ./ValueSet-PreQualProductIds.schema.json
                  valueSetUrl: http://smart.who.int/pcmt-vaxprequal/ValueSet/PreQualProductIds
                  codeCount: 275
                - filename: ValueSet-DisclosureStatements.schema.json
                  id: http://smart.who.int/trust-phw/ValueSet-DisclosureStatements.schema.json
                  title: Disclosure Statements Schema
                  description: JSON Schema for Disclosure Statements ValueSet codes.
                    Generated from FHIR expansions.
                  url: ./ValueSet-DisclosureStatements.schema.json
                  valueSetUrl: http://smart.who.int/trust-phw/ValueSet/DisclosureStatements
                  codeCount: 13
components:
  schemas:
    EnumerationResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/ValueSets.json.schema'
      title: ValueSet Enumeration Schema
      description: JSON Schema defining the structure of the ValueSet enumeration
        endpoint response
      type: object
      properties:
        type:
          type: string
          const: valueset
          description: The type of schemas enumerated (valueset)
        count:
          type: integer
          description: Total number of schemas available
        schemas:
          type: array
          description: Array of available schemas
          items:
            type: object
            properties:
              filename:
                type: string
                description: Schema filename
              id:
                type: string
                description: Schema $id
              title:
                type: string
                description: Schema title
              description:
                type: string
                description: Schema description
              url:
                type: string
                description: Relative URL to the schema file
              valueSetUrl:
                type: string
                description: FHIR canonical URL of the ValueSet
              codeCount:
                type: integer
                description: Number of codes in the ValueSet
            required:
            - filename
            - title
            - url
      required:
      - type
      - count
      - schemas
      example: *id001
